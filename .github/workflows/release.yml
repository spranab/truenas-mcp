name: Release

# Publishes to npm and cuts a GitHub release.
#
# Triggered by pushing a v* tag, or manually against a tag that already exists
# (useful when a tag was pushed before this workflow was in place).
#
# Auth: npm trusted publishing (OIDC) is used when this repo is configured as a
# trusted publisher for the package on npmjs.com — no stored credential, and the
# published package gets a provenance attestation. If a NPM_TOKEN secret is set
# instead, npm falls back to that.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.0.1)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC)

    steps:
      - name: Resolve tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1+; Node 22 ships an older npm.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check tag matches package.json version
        run: |
          tag_version="${TAG#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $TAG does not match package.json version $pkg_version" >&2
            exit 1
          fi
        env:
          TAG: ${{ steps.tag.outputs.name }}

      - run: npm ci

      - run: npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
        env:
          TAG: ${{ steps.tag.outputs.name }}
          GH_TOKEN: ${{ github.token }}
